Region: us-east-1
Image:
  Os: ubuntu2404
  CustomAmi: ami-08ea421ec9fad0a09

HeadNode:
  InstanceType: c5.large
  Ssh:
    KeyName: dzhang # <-- change to your keypair name
  Networking:
    SubnetId: subnet-074660a6fc92af350
    AdditionalSecurityGroups:
      - sg-0f504cd36a5dc0b34

Scheduling:
  Scheduler: slurm
  SlurmSettings:
    QueueUpdateStrategy: DRAIN
  SlurmQueues:
    - Name: ondemand
      CapacityType: ONDEMAND
      Networking:
        SubnetIds:
          - subnet-074660a6fc92af350
        AdditionalSecurityGroups:
          - sg-0f504cd36a5dc0b34
      ComputeResources:
        - Name: c524xl
          InstanceType: c5.24xlarge
          MinCount: 0
          MaxCount: 20
          DisableSimultaneousMultithreading: true  # disable hyperthreading (recommended)
          Efa:
            Enabled: false

    - Name: spot
      CapacityType: SPOT
      Networking:
        SubnetIds:
          - subnet-074660a6fc92af350
        AdditionalSecurityGroups:
          - sg-0f504cd36a5dc0b34
      ComputeResources:
        - Name: c524xl
          InstanceType: c5.24xlarge
          MinCount: 0
          MaxCount: 50
          DisableSimultaneousMultithreading: true  # disable hyperthreading (recommended)
          Efa:
            Enabled: false
 
    - Name: submit-c52xl
      CapacityType: ONDEMAND
      Networking:
        SubnetIds:
          - subnet-074660a6fc92af350
        AdditionalSecurityGroups:
          - sg-0f504cd36a5dc0b34
      ComputeResources:
        - Name: c52xl
          InstanceType: c5.2xlarge
          MinCount: 0
          MaxCount: 2
          DisableSimultaneousMultithreading: true  # disable hyperthreading (recommended)
          Efa:
            Enabled: false

SharedStorage:
  - Name: fsx_input
    StorageType: FsxLustre
    MountDir: /fsx_input
    FsxLustreSettings:
      FileSystemId: fs-03e9bfee5ab98c762
